#
# Admiral mic-733-ao: QSPI-only flash configuration for the Advantech MIC-733-AO
# (Jetson AGX Orin module P3701-0000, -0004 or -0005 on Advantech's MIC-733
# carrier), on a stock NVIDIA R39.2.1 Linux_for_Tegra.
#
# NVIDIA's jetson-agx-orin-devkit flow (p3737-0000-p3701-0000.conf, which
# Advantech's own flash SOP uses) plus the carrier's boot-firmware deltas:
#   - per-SKU kernel DTB built by `make mic-733-ao` (NVIDIA's per-SKU BPMP DTB
#     and PMIC selection are kept as p3701.conf.common/the devkit conf choose);
#   - Advantech's MB1 pinmux/GPIO changes (copies of NVIDIA's a04 files patched
#     by flash/patches/0001), used for every module FAB as Advantech does;
#   - MB2 BCT without the carrier EEPROM read (flash/bct/);
#   - ODMDATA routing the GBE UPHY to PCIe C7 and HSIO lane 0 to PCIe C0;
# and the three QSPI-only settings of NVIDIA's p3737-0000-p3701-0000-qspi.conf.
# flash/flash-qspi.sh installs this file and its inputs.
#
# Derived from NVIDIA BSD-3-Clause configuration files; the NVIDIA copyright
# notice and license terms in p3737-0000-p3701-0000.conf (same directory)
# apply to this file as well.

source "${LDK_DIR}/p3737-0000-p3701-0000.conf";

mic733_select_dtb()
{
	case "${board_sku}" in
	0000|0004|0005)
		DTB_FILE="tegra234-mic-733-ao+p3701-${board_sku}.dtb";
		;;
	*)
		echo "Error: module SKU ${board_sku} is not supported on the MIC-733-AO";
		exit 1;
		;;
	esac
	TBCDTB_FILE="${DTB_FILE}";
}

update_flash_args()
{
	update_flash_args_common
	update_flash_args_p3737_0000_p3701_0000
	mic733_select_dtb
	# Carrier MB1 configuration for every FAB (NVIDIA switches early-FAB
	# modules to the non-a04 files in update_flash_args_common).
	PINMUX_CONFIG="tegra234-mb1-bct-pinmux-p3701-0000-a04-mic-733-ao.dtsi";
	PMC_CONFIG="tegra234-mb1-bct-padvoltage-p3701-0000-a04.dtsi";
}

# Carrier boot firmware.
PINMUX_CONFIG="tegra234-mb1-bct-pinmux-p3701-0000-a04-mic-733-ao.dtsi";
PMC_CONFIG="tegra234-mb1-bct-padvoltage-p3701-0000-a04.dtsi";
MB2_BCT="tegra234-mb2-bct-misc-p3701-0000-mic-733-ao.dts";
# Advantech's factory UPHY mapping (NVIDIA devkit: gbe-uphy-config-22,
# hsstp-lane-map-3,nvhs-uphy-config-0,hsio-uphy-config-0,gbe0-enable-10g).
# gbe-uphy-config-0 gives the GBE UPHY's 8 lanes to PCIe C7 (pcie@141e0000,
# the Ethernet NIC); hsio-uphy-config-16 gives HSIO lane 0 to PCIe C0
# (pcie@14180000); the on-SoC 10G MGBE is not used.
ODMDATA="gbe-uphy-config-0,hsstp-lane-map-3,nvhs-uphy-config-0,hsio-uphy-config-16";

# QSPI only (the same three settings as NVIDIA's p3737-0000-p3701-0000-qspi.conf).
EMMC_CFG="flash_t234_qspi.xml";
NO_RECOVERY_IMG=1;
NO_ROOTFS=1;
