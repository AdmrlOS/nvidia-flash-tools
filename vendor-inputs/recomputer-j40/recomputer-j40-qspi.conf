#
# Admiral recomputer-j40: QSPI-only flash configuration for the Seeed reComputer
# J40/J4012 (classic J401 carrier) with an Orin NX 16GB/8GB or Orin Nano 8GB/4GB.
#
# Modelled on Seeed's recomputer-orin-j401.conf (itself NVIDIA's
# jetson-orin-nano-devkit-super.conf plus the HDMI-carrier pinmux) but it
# sources NVIDIA's files only. The three QSPI-only settings are the ones from
# NVIDIA's jetson-orin-nano-devkit-super-qspi.conf. The DTBs and the DTBO named
# below are built by `make recomputer-j40` and are copied into kernel/dtb/ by
# flash-qspi.sh.
#
# Derived from NVIDIA/Seeed BSD-3-Clause configuration files; the NVIDIA
# copyright notice and license terms in p3768-0000-p3767-0000-super.conf (same
# directory) apply to this file as well.

source "${LDK_DIR}/p3768-0000-p3767-0000-a0.conf";

p3767_super_overlay()
{
	if [ "${board_sku}" = "0000" ] || [ "${board_sku}" = "0002" ]; then
		if [ "${board_FAB}" = "TS1" ] || [ "${board_FAB}" = "EB1" ]; then
			echo "Error: ${board_FAB} can't be used for super mode";
			exit 1;
		fi
		BPFDTB_FILE="tegra234-bpmp-3767-0000-3768-super.dtb";
		DTB_FILE="tegra234-j401-p3768-0000+p3767-0000-recomputer.dtb";
	elif [ "${board_sku}" = "0001" ]; then
		BPFDTB_FILE="tegra234-bpmp-3767-0001-3768-super.dtb";
		DTB_FILE="tegra234-j401-p3768-0000+p3767-0001-recomputer.dtb";
	elif [ "${board_sku}" = "0003" ]; then
		BPFDTB_FILE="tegra234-bpmp-3767-0003-3768-super.dtb";
		DTB_FILE="tegra234-j401-p3768-0000+p3767-0003-recomputer.dtb";
	elif [ "${board_sku}" = "0004" ]; then
		BPFDTB_FILE="tegra234-bpmp-3767-0004-3768-super.dtb";
		DTB_FILE="tegra234-j401-p3768-0000+p3767-0004-recomputer.dtb";
	else
		echo "Error: module SKU ${board_sku} is not supported on the J401";
		exit 1;
	fi
	TBCDTB_FILE="${DTB_FILE}";
}

update_flash_args()
{
	update_flash_args_common
	p3767_super_overlay
}

# QSPI only (the same three settings as NVIDIA's *-qspi.conf files).
EMMC_CFG="flash_t234_qspi.xml";
NO_RECOVERY_IMG=1;
NO_ROOTFS=1;

# J401 carrier: HDMI pinmux and pad voltage (HPD on GPIO M.0), the HDMI DCB for
# UEFI and DCE, and Seeed's dual IMX219 overlay (CAM0 serial_a, CAM1 serial_c).
PINMUX_CONFIG="tegra234-mb1-bct-pinmux-p3767-hdmi-a03.dtsi";
PMC_CONFIG="tegra234-mb1-bct-padvoltage-p3767-hdmi-a03.dtsi";
OVERLAY_DTB_FILE+=",tegra234-dcb-p3767-0000-hdmi.dtbo,tegra234-p3767-camera-p3768-imx219-dual-seeed.dtbo";
DCE_OVERLAY_DTB_FILE="tegra234-dcb-p3767-0000-hdmi.dtbo";
