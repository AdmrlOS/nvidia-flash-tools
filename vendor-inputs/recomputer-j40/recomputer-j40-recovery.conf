# reComputer J40/J4012 RAM-boot recovery image only.
#
# recomputer-j40-qspi.conf sets NO_RECOVERY_IMG=1 (as every NVIDIA *-qspi.conf
# does), so flash.sh never builds bootloader/recovery.img. NVIDIA's initrd
# flashing kernel is extracted from recovery.img, so the installer builds it
# with this configuration: identical to the QSPI one except for that switch.
source "${LDK_DIR}/recomputer-j40-qspi.conf";
NO_RECOVERY_IMG=0;
